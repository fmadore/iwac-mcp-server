name: CI

# Three layers:
#  - test: hermetic, runs on every push/PR — typecheck, build, unit tests, the
#    offline fixture MCP round-trip (synthetic parquet, IWAC_OFFLINE=1), and the
#    token budget gate (always-on tool-definition footprint against a committed
#    baseline, plus worst-case response sizes against inflated fixtures).
#  - runtime-floor: builds on the Node 24 toolchain, then runs the finished
#    bundle and offline suite on the runtime floor read from manifest.json.
#    This catches runtime API drift that esbuild's target cannot.
#  - live-smoke: weekly (and on demand) — the full smoke test against the real
#    Hugging Face dataset. Its pinned counts (smoke-test.mjs EXPECTED block) are
#    the dataset-drift alarm, so a red weekly run usually means the dataset
#    changed, not the code.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC — weekly live smoke
  workflow_dispatch:

permissions:
  contents: read

# onnxruntime-node's postinstall fetches CUDA libraries on linux/x64; the
# server only runs the CPU provider the package already ships.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mcpb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcpb/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies only: what ships in the bundles and the image.
      # The development tree carries one advisory without a fix, in a copy of
      # zod nested inside the @anthropic-ai/mcpb packer, which never ships.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check version consistency (package.json, manifest.json, CITATION.cff, README citation)
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const fail = (what, got) => {
              console.error(`version mismatch: package.json ${pkg} vs ${what} ${got}`);
              process.exit(1);
            };
            const man = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;
            if (man !== pkg) fail("manifest.json", man);

            // A stale version in the citation metadata is worse than none, so the
            // CITATION.cff field and both versions quoted in the README "How to
            // cite" block are checked here too.
            const cff = fs.readFileSync("../CITATION.cff", "utf8");
            const cffVersion = cff.match(/^version:\s*"?([^"\s]+)"?\s*$/m)?.[1];
            if (cffVersion !== pkg) fail("CITATION.cff", cffVersion);

            const readme = fs.readFileSync("../README.md", "utf8");
            const cited = [
              ["README (APA)", readme.match(/\(Version ([\d.]+)\) \[Computer software\]/)?.[1]],
              ["README (BibTeX)", readme.match(/^\s*version\s*=\s*\{([\d.]+)\},?\s*$/m)?.[1]],
            ];
            for (const [what, got] of cited) if (got !== pkg) fail(what, got);
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build server bundle
        run: npm run build

      - name: Complete offline test suite
        run: npm test

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Real-browser layout and interaction smoke tests
        run: npm run test:browser

  artifacts:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/package-validation.yml
    with:
      run-tests: false


  # The finished bundle on two runtimes: the floor manifest.json declares, and
  # the newest LTS line, which desktop hosts and the image reach before the
  # declared floor moves (Node 26 became Active LTS on 28 October 2026).
  runtime-floor:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Built bundle on Node ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: declared floor
            node: ""
          - label: "26"
            node: "26"
    defaults:
      run:
        working-directory: mcpb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcpb/package-lock.json

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Read declared runtime floor
        id: runtime
        run: |
          version=$(node -e '
            const manifest = require("./manifest.json");
            const range = manifest.compatibility?.runtimes?.node;
            const match = typeof range === "string" && /^>=\s*(\d+\.\d+\.\d+)$/.exec(range);
            if (!match) throw new Error(`invalid compatibility.runtimes.node: ${range}`);
            process.stdout.write(match[1]);
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up the test runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node || steps.runtime.outputs.version }}

      - name: Test the built bundle
        run: |
          node --version
          npm test

  # The official MCP conformance suite against the HTTP server, scored against
  # what the 2026-07-28 revision requires. The suite cannot send the bearer
  # token, so scripts/auth-proxy.mjs adds it on loopback, as nginx does in
  # production. conformance-baseline.yml lists, check by check, the failures
  # only the suite's reference fixtures could pass; any other failure, or a
  # baselined check that starts passing, fails the run. Still continue-on-error
  # until a CI run confirms the local result (exit 0 on 28 October 2026).
  # 0.2.0-alpha.12 is pinned on purpose: `latest` (0.1.x) predates 2026-07-28.
  conformance:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: MCP conformance (2026-07-28, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcpb/package-lock.json
      - name: Build and generate offline fixtures
        run: |
          npm ci
          npm run build
          node scripts/make-fixtures.mjs
      - name: Start the HTTP server behind the token proxy
        env:
          IWAC_MCP_BEARER_TOKEN: ci-conformance
          IWAC_OFFLINE: "1"
          IWAC_SEMANTIC_SEARCH_ENABLED: "false"
          PORT: "8001"
        run: |
          export IWAC_CACHE_DIR="$PWD/test/fixtures"
          nohup node server/index.js --http > "$RUNNER_TEMP/iwac-http.log" 2>&1 &
          nohup node scripts/auth-proxy.mjs 8000 8001 > "$RUNNER_TEMP/iwac-proxy.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8001/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/iwac-http.log"
          exit 1
      - name: Run the conformance suite
        run: >-
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 server
          --url http://127.0.0.1:8000/mcp
          --requirements 2026-07-28
          --expected-failures conformance-baseline.yml
          --output-dir conformance-results
      - name: Collect the server log
        if: always()
        run: |
          mkdir -p conformance-results
          cp "$RUNNER_TEMP/iwac-http.log" "$RUNNER_TEMP/iwac-proxy.log" conformance-results/ 2>/dev/null || true
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-results
          path: mcpb/conformance-results/
          if-no-files-found: ignore
          retention-days: 14

  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mcpb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcpb/package-lock.json

      # Keyed by month: a per-run key (the old scheme) could never hit exactly,
      # so every weekly run uploaded a fresh ~250 MB cache entry. A monthly key
      # re-uses one entry per month (the server refreshes stale parquet at
      # runtime anyway) and old months age out of the cache quota naturally.
      - name: Compute cache month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore HF parquet and encoder cache (~600 MB)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.iwac-mcp/cache
          key: iwac-hf-parquet-${{ steps.month.outputs.month }}
          restore-keys: |
            iwac-hf-parquet-

      - name: Install dependencies
        run: npm ci

      - name: Build server bundle
        run: npm run build

      - name: Live smoke test (real dataset)
        run: node smoke-test.mjs

      # The q8 query encoder (~350 MB, kept in the cached directory above) must
      # still tokenize like the Python reference and reach cosine >= 0.999.
      - name: Query encoder parity (EmbeddingGemma 2)
        run: npm run test:parity
