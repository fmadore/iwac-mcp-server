name: Publish verified release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Build/install/test jobs cannot publish or mint OIDC credentials.
permissions:
  contents: read

# Serialize publications, including manual dispatches, so guards and the
# `latest` update cannot race another run of this workflow.
concurrency:
  group: iwac-release-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Refuse already-published versions before building
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: node mcpb/scripts/release-guard.mjs

  validate:
    needs: preflight
    uses: ./.github/workflows/package-validation.yml
    with:
      run-tests: true
      retain-image: true

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      # Official v1.8.1 linux_amd64 artifact digest from the upstream release.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # No npm install, build, or package scripts run in this privileged job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-bundles
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image
      - name: Verify the bytes passed by validation jobs
        run: |
          sha256sum -c release-checksums.sha256
          sha256sum -c image.sha256
      - name: Repeat read-only release guard immediately before publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: node mcpb/scripts/release-guard.mjs
      - name: Install the pinned, verified Registry publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fL --retry 3 "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Reserve a new release and upload immutable assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Release $TAG"
          fi
          gh release upload "$TAG" mcpb/iwac-mcp-server-windows.mcpb mcpb/iwac-mcp-server-macos.mcpb iwac-mcp-skill.zip server.json release-checksums.sha256
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
      - name: Publish the tested image unchanged
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load -i image.tar
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag iwac-mcp-smoke:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Make verified release assets public
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
      - name: Publish the matching hashes to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
