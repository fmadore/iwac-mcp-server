blank_issues_enabled: true
contact_links:
  - name: A record in IWAC is wrong or missing
    url: https://islam.zmo.de/s/westafrica/
    about: >-
      This server serves what the IWAC dataset publishes. Check the record on
      islam.zmo.de first — if it is wrong there too, it is a curation matter,
      not a bug in this server.
  - name: Report a security vulnerability
    url: https://github.com/fmadore/iwac-mcp-server/security/policy
    about: >-
      Email the maintainer rather than opening a public issue — see the
      security policy for what is in scope.
